<!DOCTYPE html>
<html lang="en">

<head>
  <title>Weather Discover</title>
  <meta charset="UTF-8" />
  <meta name="description" content="an app that displays the weather" />
  <link rel="icon" href="cloud_image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet" />
</head>

<body>
  <main>
    <section id="hero">
      <div class="container">
        <div class="header">
          <h1>Discover the weather...</h1>
        </div>
        <div class="inputs">
          <input type="text" id="cityInput" placeholder="Enter city name" />
          <button id="searchBtn" aria-label="Search for weather">Search</button>
        </div>

        <div id="weatherResults"></div>
      </div>
    </section>
  </main>

  <div class="footer">
    <p>
      © 2025 Jordan Gross. All rights reserved. Website created as part of
      ongoing web development learning and portfolio building.
    </p>
  </div>

  <script src="script.js"></script>
</body>

</html>
