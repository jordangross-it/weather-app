<!DOCTYPE html>
<html lang="en">

<head>
  <title>Weather Discover</title>
  <meta charset="UTF-8" />
  <meta name="description" content="an app that displays the weather" />
  <link rel="icon" href="cloud_image.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/3fa12e31f9.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <section id="hero">
      <div class="container">
        <div class="header">
          <h1>Discover the weather...</h1>
        </div>
        <div class="inputs">
          <input type="text" id="cityInput" placeholder="Enter city name" />
          <div class="buttons">
            <button id="searchBtn" aria-label="Search for weather"><i class="fas fa-search"></i> Search</button>
            <button id="resetButton" aria-label="Reset search"><i class="fas fa-undo"></i></button>
          </div>
        </div>

        <div id="weatherResults"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
